name: Update NFL Model

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run NFL prediction model
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/update_data.py

      - name: Fetch Kalshi markets
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python scripts/updatekalshi.py
        continue-on-error: true

      - name: Commit updated NFL predictions
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update NFL predictions [skip ci]'
          file_pattern: 'data/nfl_*.json data/predictions.json data/elo_ratings.json data/leaderboard.json data/model_metrics.json data/kalshidata.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
