name: Update Kalshi Markets

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Kalshi markets
        env:
          KALSHI_API_KEY: ${{ secrets.KALSHI_API_KEY }}
        run: python scripts/updatekalshi.py

      - name: Commit updated Kalshi data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update Kalshi markets [skip ci]'
          file_pattern: 'data/kalshidata.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
