name: Apply Script Patches (one-shot)

on:
  push:
    branches: ['claude/nfl-prediction-dashboard-x4JPv']
    paths: ['.github/workflows/apply_script_patches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/nfl-prediction-dashboard-x4JPv
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if already patched
        id: check
        run: |
          if grep -q "learn_nfl_weights" scripts/update_data.py; then
            echo "already_patched=true" >> $GITHUB_OUTPUT
          else
            echo "already_patched=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply patches
        if: steps.check.outputs.already_patched == 'false'
        run: |
          python3 << 'PYEOF'
          with open("scripts/update_data.py") as f:
              src = f.read()
          src = src.replace(
              "from model.ensemble_model import (build_xgb_features, train_xgboost, predict_xgboost,\n                                   ensemble_predict, kelly_criterion,\n                                   american_to_prob, remove_vig)",
              "from model.ensemble_model import (build_xgb_features, train_xgboost, predict_xgboost,\n                                   ensemble_predict, kelly_criterion,\n                                   american_to_prob, remove_vig, DEFAULT_WEIGHTS)\nfrom model.nfl_ensemble_weights import learn_nfl_weights"
          )
          marker = "    # \u2500\u2500 8. Generate per-game predictions \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500"
          src = src.replace(marker, "\n    # \u2500\u2500 7b. Learn ensemble weights (Issue 5) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n    log.info(\"Learning NFL ensemble weights...\")\n    nfl_weights = learn_nfl_weights(fte_df, pythagorean_data, efficiency_data, DEFAULT_WEIGHTS)\n\n" + marker)
          src = src.replace(
              '            ensemble_prob = ensemble_predict(\n                logistic_prob=log_prob,\n                xgb_prob=xgb_prob,\n                elo_prob=elo_result["prob"],\n                pyth_prob=eff_result["pyth_prob"],\n                eff_prob=eff_result["eff_prob"]\n            )',
              '            ensemble_prob = ensemble_predict(\n                logistic_prob=log_prob,\n                xgb_prob=xgb_prob,\n                elo_prob=elo_result["prob"],\n                pyth_prob=eff_result["pyth_prob"],\n                eff_prob=eff_result["eff_prob"],\n                weights=nfl_weights,\n            )'
          )
          with open("scripts/update_data.py", "w") as f: f.write(src)
          assert "learn_nfl_weights" in src and "weights=nfl_weights" in src, "update_data patch FAILED"
          print("update_data.py OK")

          with open("scripts/update_nba_data.py") as f:
              src = f.read()
          src = src.replace(
              "season_sim = simulate_season(\n            NBA_TEAMS, remaining_schedule, bayesian_ratings, n_sims=3000\n        )",
              "season_sim = simulate_season(\n            NBA_TEAMS, remaining_schedule, bayesian_ratings, n_sims=5000  # Issue 9: 3000->5000\n        )"
          )
          src = src.replace(
              '        model = xgb.XGBClassifier(\n                n_estimators=300, max_depth=4, learning_rate=0.05,\n                subsample=0.8, colsample_bytree=0.8,\n                reg_alpha=0.1, reg_lambda=1.0,\n                eval_metric="logloss", random_state=42,\n            )\n            model.fit(X_scaled, y)',
              '        split = max(1, int(len(X_scaled)*0.8)); X_train,X_val=X_scaled[:split],X_scaled[split:]; y_train,y_val=y[:split],y[split:]\n            model = xgb.XGBClassifier(\n                n_estimators=500, max_depth=4, learning_rate=0.05,\n                subsample=0.8, colsample_bytree=0.8, min_child_weight=10,\n                reg_alpha=0.1, reg_lambda=1.0, eval_metric="logloss",\n                early_stopping_rounds=20, random_state=42, n_jobs=-1, verbosity=0,\n            )\n            model.fit(X_train, y_train, eval_set=[(X_val, y_val)], verbose=False)'
          )
          src = src.replace(
              '            # Pythagorean prediction \u2014 direct ratio (Bradley-Terry), not ELO transform\n            pyth_home = pyth_data.get(home, {}).get("pyth", 0.5)\n            pyth_away = pyth_data.get(away, {}).get("pyth", 0.5)\n            # Scale home court advantage into pythagorean space (hfa=100 ELO \u2248 +6.7% win prob)\n            pyth_home_adj = pyth_home * (1.0 + hfa / 1500.0)\n            _pyth_denom = pyth_home_adj + pyth_away\n            pyth_prob = pyth_home_adj / _pyth_denom if _pyth_denom > 0 else 0.5',
              '            # Issue 1: Pythagorean HFA via additive ELO-space logistic\n            pyth_home = pyth_data.get(home, {}).get("pyth", 0.5)\n            pyth_away = pyth_data.get(away, {}).get("pyth", 0.5)\n            _pyth_elo_home = 1500.0 + (pyth_home - 0.5) * 400.0\n            _pyth_elo_away = 1500.0 + (pyth_away - 0.5) * 400.0\n            pyth_prob = 1.0 / (1.0 + 10 ** (-((_pyth_elo_home + hfa) - _pyth_elo_away) / 400.0))'
          )
          helper = '\ndef _nba_inference_features(home,away,elo_dict,game_history,efficiency_data,pyth_data,neutral,hfa,rest_diff,b2b_home,b2b_away):\n    """Issue 8: shared 14-col feature builder (fixes train/inference mismatch)."""\n    e1,e2=elo_dict.get(home,1500.0),elo_dict.get(away,1500.0)\n    f1,f2=efficiency_data.get(home,{}),efficiency_data.get(away,{})\n    p1,p2=pyth_data.get(home,{}).get("pyth",0.5),pyth_data.get(away,{}).get("pyth",0.5)\n    return [(e1+hfa)-e2,hfa,rest_diff,(p1-p2)*400.0,\n            f1.get("net_rating",0.0)-f2.get("net_rating",0.0),\n            f1.get("offensive_rating",110.0)-f2.get("offensive_rating",110.0),\n            f2.get("defensive_rating",110.0)-f1.get("defensive_rating",110.0),\n            f1.get("pace",100.0)-f2.get("pace",100.0),\n            f2.get("turnover_rate",0.5)-f1.get("turnover_rate",0.5),\n            f1.get("three_point_rate",0.35)-f2.get("three_point_rate",0.35),\n            f1.get("rebound_rate",0.5)-f2.get("rebound_rate",0.5),\n            f1.get("free_throw_rate",0.20)-f2.get("free_throw_rate",0.20),\n            nba_recent_form(game_history,home)-nba_recent_form(game_history,away),\n            float(b2b_home)-float(b2b_away)]\n\n'
          src = src.replace("def build_nba_features(", helper+"def build_nba_features(")
          src = src.replace(
              '            home_eff = efficiency_data.get(home, {})\n            away_eff = efficiency_data.get(away, {})\n            feat = [\n                (home_elo + hfa) - away_elo,\n                hfa,\n                rest_diff,\n                pyth_elo_home - pyth_elo_away,\n                home_eff.get("net_rating", 0) - away_eff.get("net_rating", 0),\n                home_eff.get("offensive_rating", 110) - away_eff.get("offensive_rating", 110),\n                away_eff.get("defensive_rating", 110) - home_eff.get("defensive_rating", 110),\n                home_eff.get("pace", 100) - away_eff.get("pace", 100),\n                away_eff.get("turnover_rate", 0.5) - home_eff.get("turnover_rate", 0.5),\n                home_eff.get("three_point_rate", 0.35) - away_eff.get("three_point_rate", 0.35),\n                home_eff.get("rebound_rate", 0.5) - away_eff.get("rebound_rate", 0.5),\n                home_eff.get("free_throw_rate", 0.20) - away_eff.get("free_throw_rate", 0.20),\n                nba_recent_form(game_history, home) - nba_recent_form(game_history, away),\n                float(b2b_home) - float(b2b_away),\n            ]',
              '            # Issue 8: shared feature builder\n            feat = _nba_inference_features(home,away,elo_dict,game_history,efficiency_data,pyth_data,neutral=neutral,hfa=hfa,rest_diff=rest_diff,b2b_home=b2b_home,b2b_away=b2b_away)'
          )
          with open("scripts/update_nba_data.py", "w") as f: f.write(src)
          assert "n_sims=5000" in src and "early_stopping_rounds=20" in src, "nba patch FAILED"
          assert "_pyth_elo_home" in src and "_nba_inference_features" in src, "nba patch FAILED"
          print("update_nba_data.py OK")
          PYEOF

      - name: Commit patches
        if: steps.check.outputs.already_patched == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/update_data.py scripts/update_nba_data.py
          git diff --cached --stat
          git commit -m "fix(scripts): Issues 1/5/7/8/9 - patch update_data + update_nba_data [skip ci]"
          git push

      - name: Self-cleanup
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git rm -f .github/workflows/apply_script_patches.yml 2>/dev/null || true
          git commit -m "chore: remove one-shot patch workflow [skip ci]" || true
          git push || true
