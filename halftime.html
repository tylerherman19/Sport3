<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Model - Halftime report</title>
<meta name="description" content="NFL predictions from a walk-forward-tested model. Sixteen games a week, every pick written down before kickoff and graded after." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#FAFAF7; --ink:#131313; --muted:#676761; --faint:#E4E3DB;
  --blue:#013369; /* NFL shield blue - the only accent */
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",sans-serif;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums}
.disp{font-family:"Archivo Black",sans-serif;font-weight:400}

/* scorebug */
.bug{position:sticky;top:0;z-index:9;background:var(--ink);color:#fff;display:flex;align-items:stretch;font-size:12px}
.bug .b1{background:var(--blue);padding:8px 12px;font-family:"Archivo Black";font-size:16px;letter-spacing:.02em}
.bug .b2{padding:10px 12px;font-weight:600;letter-spacing:.12em}
.bug .b3{margin-left:auto;padding:10px 12px;color:#9a9a94;font-weight:500}

.strip-head{background:var(--ink);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-top:24px}
.strip-head h2{font-family:"Archivo Black";font-size:20px;letter-spacing:.02em;font-weight:400}
.strip-head span{font-size:11px;letter-spacing:.14em;color:#9a9a94;font-weight:600}
.lede{padding:20px 16px;font-size:17px;line-height:26px;font-weight:500;border-bottom:4px solid var(--ink)}
.lede b{color:var(--blue)}
.sec-note{padding:12px 16px;font-size:12px;line-height:16px;color:var(--muted);border-bottom:1px solid var(--faint)}

/* rundown strips */
.game{border-bottom:1px solid var(--faint)}
.grow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px;background:none;border:none;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:center}
.gside .tm{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.gside .pc{font-family:"Archivo Black";font-size:32px;line-height:36px}
.gside.win .pc{color:var(--blue)}
.gmid{padding:0 16px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);line-height:16px}
.possess{height:8px;display:flex;background:var(--faint)}
.possess i{display:block;background:var(--ink)}
.possess i.w{background:var(--blue)}
.gdet{display:none;padding:0 16px 16px;font-size:13px;line-height:20px}
.game.open .gdet{display:block}
.gdet p{padding:6px 0;border-top:1px solid var(--faint)}
.gdet b{font-weight:700}
.gdet .models{color:var(--muted);font-size:12px}
.gdet .models .ship{color:var(--blue);font-weight:700}

/* audible (per-game what-if) */
.audible{margin-top:8px;border-top:4px solid var(--ink);padding-top:8px}
.audible h5{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.audrow{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:4px 0}
.audrow output{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.audres{font-size:13px;padding:6px 0}
.audres b{color:var(--blue)}

/* on the record */
.rec-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--faint)}
.rec-strip .rs{padding:16px 8px;text-align:center;border-right:1px solid var(--faint)}
.rec-strip .rs:last-child{border-right:none}
.rec-strip .n{font-family:"Archivo Black";font-size:28px;line-height:32px;display:block}
.rec-strip .n.blue{color:var(--blue)}
.rec-strip .l{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.rec{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:10px 16px;border-bottom:1px solid var(--faint);font-size:13px;align-items:baseline}
.rec .d{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rec .pk b{font-weight:700}
.rec .pk .v{color:var(--muted);font-size:12px}
.rec .res{font-family:"Archivo Black";font-size:14px;text-align:right}
.rec .res.hit{color:var(--blue)}
.rec .res.miss{color:var(--muted);text-decoration:line-through}
.rec .res.pend{color:var(--muted);font-family:"Archivo";font-weight:600;font-size:11px;letter-spacing:.1em}
.burn{display:block;width:100%;background:none;border:none;border-top:1px solid var(--faint);padding:12px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);cursor:pointer;text-align:center}
.burn:hover{color:var(--ink)}

/* halftime report */
.halftime{display:grid;grid-template-columns:1fr 1fr;border-top:4px solid var(--ink)}
.hf{padding:16px;border-bottom:1px solid var(--faint)}
.hf:nth-child(odd){border-right:1px solid var(--faint)}
.hf .n{font-family:"Archivo Black";font-size:36px;line-height:40px;display:block}
.hf .n.blue{color:var(--blue)}
.hf .l{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.note{padding:16px;font-size:12px;color:var(--muted);line-height:16px}
.cal{padding:8px 16px 16px}
.cal h5,.szn h5{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:8px 0}
.calrow{display:grid;grid-template-columns:56px 1fr 88px;gap:8px;align-items:center;padding:3px 0;font-size:11px;font-weight:600;color:var(--muted)}
.calrow .bars{display:grid;gap:2px}
.calrow .bars i{display:block;height:6px;background:var(--faint)}
.calrow .bars i.a{background:var(--blue)}
.calrow .va{text-align:right;font-variant-numeric:tabular-nums}
.szn{padding:0 16px 16px}
.sznrow{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;padding:3px 0;font-size:12px;font-weight:600}
.sznrow i{display:block;height:8px;background:var(--ink)}
.sznrow .va{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* crawl */
.crawl{border-top:4px solid var(--ink)}
.crow{display:grid;grid-template-columns:36px 56px 1fr auto;gap:8px;padding:8px 16px;border-bottom:1px solid var(--faint);font-size:13px;align-items:baseline}
.crow .rk{font-family:"Archivo Black";font-size:18px;color:var(--blue)}
.crow .tm{font-weight:700}
.crow .num{text-align:right;color:var(--muted)}
.crow .num b{color:var(--ink)}

/* control room */
.ctrl{padding:8px 16px 16px;border-top:4px solid var(--ink)}
.ctrlrow{display:grid;grid-template-columns:112px 1fr 48px;gap:12px;align-items:center;padding:6px 0}
.ctrlrow label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ctrlrow output{text-align:right;font-family:"Archivo Black";font-size:16px;font-variant-numeric:tabular-nums}
.ctrl input[type=range],.audible input[type=range]{width:100%;accent-color:var(--blue)}
.ctrlnote{font-size:11px;color:var(--muted);line-height:16px;padding-top:8px}
.ctrlreset{margin-top:12px;width:100%;padding:12px;font:inherit;font-weight:700;background:var(--paper);color:var(--ink);border:1px solid var(--ink);cursor:pointer;font-size:13px}
.ctrlreset:hover{background:var(--ink);color:#fff}

/* injuries */
.iteam{padding:12px 16px;border-bottom:1px solid var(--faint);font-size:12px;line-height:16px;color:var(--muted)}
.iteam b{color:var(--ink)}
.iteam h4{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;margin-bottom:4px}
.iteam .out{color:var(--blue);font-weight:700}

/* toy */
.toy{padding:16px;border-top:4px solid var(--ink)}
.toy select,.toy input[type=number]{font:inherit;padding:8px;border:1px solid var(--ink);background:var(--paper);width:100%;font-size:15px}
.toy label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:block;margin:12px 0 4px;text-transform:uppercase}
.toyrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toy button{margin-top:16px;width:100%;padding:12px;font:inherit;font-weight:700;background:var(--ink);color:#fff;border:none;cursor:pointer;font-size:15px}
.toy button:hover{background:var(--blue)}
.toyres{margin-top:16px;display:none}
.toyres .v{font-family:"Archivo Black";font-size:28px;line-height:32px}
.toyres .v span{color:var(--blue)}
.toyres .w{font-size:13px;color:var(--muted);margin-top:8px;line-height:20px}

.colophon{padding:24px 16px 48px;font-size:12px;line-height:16px;color:var(--muted)}
.colophon p{max-width:640px;margin-bottom:8px}
@media(min-width:760px){
  main{max-width:960px;margin:0 auto}
  .gside .pc{font-size:44px;line-height:48px}
  .halftime{grid-template-columns:repeat(4,1fr)}
  .hf{border-right:1px solid var(--faint)}
  .hf:last-child{border-right:none}
}

/* page nav */
.pagenav{position:sticky;top:36px;z-index:8;background:var(--paper);display:flex;overflow-x:auto;border-bottom:4px solid var(--ink);-webkit-overflow-scrolling:touch}
.pagenav a{flex:0 0 auto;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-decoration:none;border-right:1px solid var(--faint)}
.pagenav a.on{color:var(--blue);box-shadow:inset 0 -4px 0 var(--blue)}
.bug .b1 a{color:#fff;text-decoration:none}
.ctrlgo{display:block;margin-top:12px;padding:12px;text-align:center;font-weight:700;background:var(--ink);color:#fff;text-decoration:none;font-size:15px}
.ctrlgo:hover{background:var(--blue)}
/* calibration, said vs happened */
.calrow2{padding:8px 0;border-bottom:1px solid var(--faint)}
.calrow2 .bh{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;padding-bottom:4px}
.calbar{display:grid;grid-template-columns:76px 1fr 44px;gap:8px;align-items:center;padding:2px 0;font-size:11px;font-weight:700}
.calbar .tag{color:var(--muted);letter-spacing:.08em}
.calbar i{display:block;height:8px;background:var(--ink)}
.calbar.hp i{background:var(--blue)}
.calbar.hp .va{color:var(--blue)}
.calbar .va{text-align:right;font-variant-numeric:tabular-nums}
.hrow{padding:12px 0;border-bottom:1px solid var(--faint)}
.hrow .hh{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between;padding-bottom:4px}
.hrow .hbig{display:flex;align-items:baseline;gap:12px}
.hrow .n{font-family:"Archivo Black";font-size:44px;line-height:48px}
.hrow .n.blue{color:var(--blue)}
.hrow .sub{font-size:12px;color:var(--muted);font-weight:600}
</style>
<link rel="stylesheet" href="ui.css" />
</head>
<body data-page="halftime">
<div class="bug"><span class="b1"><a href="index.html">THE MODEL</a></span><span class="b2" id="bug-week">WK 1</span><span class="b3" id="bug-upd"></span></div>
<nav class="pagenav">
<a href="index.html" data-pg="rundown">RUNDOWN</a>
<a href="record.html" data-pg="record">RECORD</a>
<a href="halftime.html" data-pg="halftime" class="on">HALFTIME</a>
<a href="crawl.html" data-pg="crawl">CRAWL</a>
<a href="injuries.html" data-pg="injuries">INJURIES</a>
<a href="play.html" data-pg="play">PLAY</a>
<a href="control.html" data-pg="control">CONTROL</a>
</nav>
<main>
<header class="strip-head"><h2>HALFTIME REPORT</h2><span>MODEL VS VEGAS</span></header>
<div class="halftime" id="hf"></div>
<p class="note" id="hf-note"></p>
<div class="cal" id="cal"></div>
<div class="szn" id="szn"></div>
<section class="edge-test" id="edge-test"></section>
</main>
<script>const TZ="America/Chicago";
const DATA_BASE="./data/";
async function getJSON(f){try{const r=await fetch(DATA_BASE+f+"?t="+Date.now());return r.ok?await r.json():null}catch{return null}}
async function loadAll(){
  const [pred,lb,metrics,inj]=await Promise.all([
    getJSON("nfl_predictions.json").then(d=>d||getJSON("predictions.json")),
    getJSON("nfl_leaderboard.json").then(d=>d||getJSON("leaderboard.json")),
    getJSON("model_metrics.json"),
    getJSON("nfl_injuries.json")]);
  return {pred,lb,metrics,inj:inj?.injuries||[]};
}
const pct1=p=>p==null?"—":(p*100).toFixed(1)+"%";
const pct0=p=>p==null?"—":Math.round(p*100)+"%";
const fmtInt=n=>n==null?"—":Number(n).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function kickoff(g){const d=new Date(g.game_time);return{day:d.toLocaleDateString("en-US",{timeZone:TZ,weekday:"short"}).toUpperCase(),time:d.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).replace(" ","").toLowerCase()}}
function gamesFor(pred,w){return (pred?.games||[]).filter(g=>g.week===w).sort((a,b)=>new Date(a.game_time)-new Date(b.game_time))}

const NFL_COORDS={ARI:[33.5276,-112.2626],ATL:[33.7553,-84.4006],BAL:[39.2780,-76.6227],BUF:[42.7738,-78.7870],CAR:[35.2258,-80.8528],CHI:[41.8623,-87.6167],CIN:[39.0954,-84.5160],CLE:[41.5061,-81.6995],DAL:[32.7473,-97.0945],DEN:[39.7439,-105.0201],DET:[42.3400,-83.0456],GB:[44.5013,-88.0622],HOU:[29.6847,-95.4107],IND:[39.7601,-86.1639],JAX:[30.3240,-81.6373],KC:[39.0489,-94.4839],LAC:[33.9534,-118.3392],LAR:[33.9534,-118.3392],LV:[36.0909,-115.1833],MIA:[25.9580,-80.2389],MIN:[44.9738,-93.2581],NE:[42.0909,-71.2643],NO:[29.9509,-90.0814],NYG:[40.8128,-74.0742],NYJ:[40.8128,-74.0742],PHI:[39.9008,-75.1675],PIT:[40.4468,-80.0158],SEA:[47.5952,-122.3316],SF:[37.4030,-121.9700],TB:[27.9759,-82.5033],TEN:[36.1665,-86.7713],WAS:[38.9076,-76.8645]};
const hav=(a,b)=>{const R=3958.8,r=Math.PI/180,dL=(b[0]-a[0])*r,dO=(b[1]-a[1])*r,h=Math.sin(dL/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const eP=d=>1/(1+Math.pow(10,-d/400));

let WEEK=null, PRED=null, LB=null;

/* ── halftime report ── */
function renderHF(m){
  if(!m)return;
  document.getElementById("hf").innerHTML=[
    {n:pct1(m.accuracy),l:"Model accuracy · "+fmtInt(m.n_scored_games)+" games"},
    {n:pct1(m.vegas_benchmark?.accuracy),l:"Vegas accuracy",blue:1},
    {n:m.log_loss?.toFixed(3),l:"Log loss (Vegas "+(m.vegas_benchmark?.log_loss?.toFixed(3)??"—")+")"},
    {n:m.auc?.toFixed(3),l:"AUC (Vegas "+(m.vegas_benchmark?.auc?.toFixed(3)??"—")+")"},
  ].map(s=>`<div class="hf"><span class="n ${s.blue?"blue":""}">${s.n}</span><span class="l">${s.l}</span></div>`).join("");
  const yrs=(m.historical_accuracy||[]).slice(-3).map(h=>h.year+": "+pct1(h.accuracy)).join(" · ");
  document.getElementById("hf-note").textContent="Last three seasons: "+yrs+". Walk-forward backtest, pre-game information only. The model trails Vegas by "+((m.vegas_benchmark?.accuracy-m.accuracy)*100).toFixed(1)+" points. Bet accordingly: don't.";
  const buckets=(m.calibration_buckets||[]).filter(b=>b.count>0);
  /* fold home-team buckets into pick-confidence bands */
  const BANDS=[[.5,.6,"COIN FLIP","50-60%"],[.6,.7,"CLEAR FAVORITE","60-70%"],[.7,.8,"STRONG FAVORITE","70-80%"],[.8,1.01,"HEAVY FAVORITE","80%+"],];
  const agg=BANDS.map(b=>({...b,said:0,hit:0,n:0}));
  for(const b of buckets){
    const conf=b.predicted>=.5?b.predicted:1-b.predicted;
    const hit=b.predicted>=.5?b.actual:1-b.actual;
    const band=agg.find(a=>conf>=a[0]&&conf<a[1]);
    if(band){band.said+=b.count*conf;band.hit+=b.count*hit;band.n+=b.count}
  }
  document.getElementById("cal").innerHTML=`<h5>CALIBRATION CHECK</h5><p class="note" style="padding:0 0 8px">2,486 past games, graded. Each row compares forecast confidence with observed win rate. Sample size limits precision.</p>`+agg.filter(a=>a.n>0).map(a=>{
    const said=a.said/a.n, hit=a.hit/a.n, honest=hit>=said;
    return `<div class="hrow"><div class="hh"><span>THE MODEL SAID ${a[3]} · ${a[2]}</span><span>${a.n} GAMES</span></div><div class="hbig"><span class="n ${honest?'blue':''}">${(hit*100).toFixed(0)}%</span><span class="sub">of those picks won - it said ${(said*100).toFixed(0)}%. ${honest?'Met or beat forecast in this band.':'Observed rate below forecast in this band.'}</span></div></div>`}).join("")+`<p class="note" style="padding:8px 0 0">Calibration is evidence, not certainty. Model probability is not a betting recommendation.</p>`;
  const hist=(m.historical_accuracy||[]);
  document.getElementById("szn").innerHTML=hist.length?`<h5>SEASON BY SEASON</h5>`+hist.map(h=>
    `<div class="sznrow"><span>${h.year}</span><i style="width:${(h.accuracy*100).toFixed(0)}%"></i><span class="va">${pct1(h.accuracy)}</span></div>`).join(""):"";
}

function renderMarketEdge(backtest){
  const box=document.getElementById("edge-test");
  if(!backtest){box.innerHTML="";return}
  const primary=(backtest.cutoffs||[]).find(r=>r.min_edge===backtest.primary_cutoff);
  if(!primary){box.innerHTML="";return}
  const roi=pct1(primary.roi), good=primary.roi>0;
  box.innerHTML=`
    <header class="strip-head edge-head"><h2>MARKET EDGE BACKTEST</h2><span>ARCHIVED MONEYLINES · 2017–2025</span></header>
    <div class="edge-verdict ${good?"good":"bad"}">
      <span class="edge-kicker">${good?"POSITIVE IN THIS SAMPLE":"MODEL DOES NOT BEAT THIS MARKET"}</span>
      <strong>${roi} ROI</strong>
      <p>Fixed ${pct0(backtest.primary_cutoff)} minimum edge · ${fmtInt(primary.bets)} hypothetical one-unit bets · ${primary.net_units>0?"+":""}${primary.net_units.toFixed(2)} units.</p>
    </div>
    <p class="note">This is the actual market-edge test: before each game, take the side where model probability exceeds the devigged market probability by the stated cutoff. Every cutoff is shown. No cutoff was selected after seeing results.</p>
    <div class="edge-grid">${(backtest.cutoffs||[]).map(r=>`<div class="edge-row ${r.min_edge===backtest.primary_cutoff?"primary":""}"><span class="edge-cut">${pct0(r.min_edge)}+ EDGE</span><b class="${r.roi>0?"pos":"neg"}">${pct1(r.roi)} ROI</b><span>${fmtInt(r.bets)} bets · ${r.net_units>0?"+":""}${r.net_units.toFixed(1)}u</span></div>`).join("")}</div>
    <div class="szn edge-season"><h5>5% EDGE · SEASON BY SEASON</h5>${(backtest.season_roi_at_primary_cutoff||[]).map(r=>`<div class="sznrow"><span>${r.season}</span><i class="${r.roi>=0?"positive":"negative"}" style="width:${Math.min(100,Math.abs(r.roi||0)*500).toFixed(0)}%"></i><span class="va ${r.roi>=0?"pos":"neg"}">${r.roi==null?"—":pct1(r.roi)}</span></div>`).join("")}</div>
    <p class="note edge-caveat">${esc(backtest.market_price_note)} This is research, not a betting recommendation.</p>`;
}


function fillBug(pred){
  if(!pred)return;
  document.getElementById("bug-week").textContent="WK "+(pred.week??1)+" · "+pred.season;
  const u=pred.updated?new Date(pred.updated):null;
  document.getElementById("bug-upd").textContent=u?("UPD "+u.toLocaleString("en-US",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).toUpperCase()):"";
}

(async()=>{
  const {pred,metrics}=await loadAll();
  fillBug(pred);
  renderHF(metrics);
  renderMarketEdge(metrics?.market_edge_backtest);
})();
</script>
</body>
</html>
