<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Model - Sunday rundown</title>
<meta name="description" content="NFL predictions from a walk-forward-tested model. Sixteen games a week, every pick written down before kickoff and graded after." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#FAFAF7; --ink:#131313; --muted:#676761; --faint:#E4E3DB;
  --blue:#013369; /* NFL shield blue - the only accent */
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
body{background:var(--paper);color:var(--ink);font-family:"Archivo",sans-serif;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums}
.disp{font-family:"Archivo Black",sans-serif;font-weight:400}

/* scorebug */
.bug{position:sticky;top:0;z-index:9;background:var(--ink);color:#fff;display:flex;align-items:stretch;font-size:12px}
.bug .b1{background:var(--blue);padding:8px 12px;font-family:"Archivo Black";font-size:16px;letter-spacing:.02em}
.bug .b2{padding:10px 12px;font-weight:600;letter-spacing:.12em}
.bug .b3{margin-left:auto;padding:10px 12px;color:#9a9a94;font-weight:500}

.strip-head{background:var(--ink);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-top:24px}
.strip-head h2{font-family:"Archivo Black";font-size:20px;letter-spacing:.02em;font-weight:400}
.strip-head span{font-size:11px;letter-spacing:.14em;color:#9a9a94;font-weight:600}
.lede{padding:20px 16px;font-size:17px;line-height:26px;font-weight:500;border-bottom:4px solid var(--ink)}
.lede b{color:var(--blue)}
.sec-note{padding:12px 16px;font-size:12px;line-height:16px;color:var(--muted);border-bottom:1px solid var(--faint)}

/* rundown strips */
.game{border-bottom:1px solid var(--faint)}
.grow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:16px;background:none;border:none;width:100%;font:inherit;color:inherit;cursor:pointer;text-align:center}
.gside .tm{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
.gside .pc{font-family:"Archivo Black";font-size:32px;line-height:36px}
.gside.win .pc{color:var(--blue)}
.gmid{padding:0 16px;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);line-height:16px}
.possess{height:8px;display:flex;background:var(--faint)}
.possess i{display:block;background:var(--ink)}
.possess i.w{background:var(--blue)}
.gdet{display:none;padding:0 16px 16px;font-size:13px;line-height:20px}
.game.open .gdet{display:block}
.gdet p{padding:6px 0;border-top:1px solid var(--faint)}
.gdet b{font-weight:700}
.gdet .models{color:var(--muted);font-size:12px}
.gdet .models .ship{color:var(--blue);font-weight:700}

/* audible (per-game what-if) */
.audible{margin-top:8px;border-top:4px solid var(--ink);padding-top:8px}
.audible h5{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);margin-bottom:4px}
.audrow{display:grid;grid-template-columns:72px 1fr 44px;gap:8px;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:4px 0}
.audrow output{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.audres{font-size:13px;padding:6px 0}
.audres b{color:var(--blue)}

/* on the record */
.rec-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--faint)}
.rec-strip .rs{padding:16px 8px;text-align:center;border-right:1px solid var(--faint)}
.rec-strip .rs:last-child{border-right:none}
.rec-strip .n{font-family:"Archivo Black";font-size:28px;line-height:32px;display:block}
.rec-strip .n.blue{color:var(--blue)}
.rec-strip .l{font-size:10px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.rec{display:grid;grid-template-columns:64px 1fr auto;gap:8px;padding:10px 16px;border-bottom:1px solid var(--faint);font-size:13px;align-items:baseline}
.rec .d{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.rec .pk b{font-weight:700}
.rec .pk .v{color:var(--muted);font-size:12px}
.rec .res{font-family:"Archivo Black";font-size:14px;text-align:right}
.rec .res.hit{color:var(--blue)}
.rec .res.miss{color:var(--muted);text-decoration:line-through}
.rec .res.pend{color:var(--muted);font-family:"Archivo";font-weight:600;font-size:11px;letter-spacing:.1em}
.burn{display:block;width:100%;background:none;border:none;border-top:1px solid var(--faint);padding:12px;font:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);cursor:pointer;text-align:center}
.burn:hover{color:var(--ink)}

/* halftime report */
.halftime{display:grid;grid-template-columns:1fr 1fr;border-top:4px solid var(--ink)}
.hf{padding:16px;border-bottom:1px solid var(--faint)}
.hf:nth-child(odd){border-right:1px solid var(--faint)}
.hf .n{font-family:"Archivo Black";font-size:36px;line-height:40px;display:block}
.hf .n.blue{color:var(--blue)}
.hf .l{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.note{padding:16px;font-size:12px;color:var(--muted);line-height:16px}
.cal{padding:8px 16px 16px}
.cal h5,.szn h5{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--muted);padding:8px 0}
.calrow{display:grid;grid-template-columns:56px 1fr 88px;gap:8px;align-items:center;padding:3px 0;font-size:11px;font-weight:600;color:var(--muted)}
.calrow .bars{display:grid;gap:2px}
.calrow .bars i{display:block;height:6px;background:var(--faint)}
.calrow .bars i.a{background:var(--blue)}
.calrow .va{text-align:right;font-variant-numeric:tabular-nums}
.szn{padding:0 16px 16px}
.sznrow{display:grid;grid-template-columns:44px 1fr 52px;gap:8px;align-items:center;padding:3px 0;font-size:12px;font-weight:600}
.sznrow i{display:block;height:8px;background:var(--ink)}
.sznrow .va{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}

/* crawl */
.crawl{border-top:4px solid var(--ink)}
.crow{display:grid;grid-template-columns:36px 56px 1fr auto;gap:8px;padding:8px 16px;border-bottom:1px solid var(--faint);font-size:13px;align-items:baseline}
.crow .rk{font-family:"Archivo Black";font-size:18px;color:var(--blue)}
.crow .tm{font-weight:700}
.crow .num{text-align:right;color:var(--muted)}
.crow .num b{color:var(--ink)}

/* control room */
.ctrl{padding:8px 16px 16px;border-top:4px solid var(--ink)}
.ctrlrow{display:grid;grid-template-columns:112px 1fr 48px;gap:12px;align-items:center;padding:6px 0}
.ctrlrow label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.ctrlrow output{text-align:right;font-family:"Archivo Black";font-size:16px;font-variant-numeric:tabular-nums}
.ctrl input[type=range],.audible input[type=range]{width:100%;accent-color:var(--blue)}
.ctrlnote{font-size:11px;color:var(--muted);line-height:16px;padding-top:8px}
.ctrlreset{margin-top:12px;width:100%;padding:12px;font:inherit;font-weight:700;background:var(--paper);color:var(--ink);border:1px solid var(--ink);cursor:pointer;font-size:13px}
.ctrlreset:hover{background:var(--ink);color:#fff}

/* injuries */
.iteam{padding:12px 16px;border-bottom:1px solid var(--faint);font-size:12px;line-height:16px;color:var(--muted)}
.iteam b{color:var(--ink)}
.iteam h4{font-size:13px;color:var(--ink);display:flex;justify-content:space-between;margin-bottom:4px}
.iteam .out{color:var(--blue);font-weight:700}

/* toy */
.toy{padding:16px;border-top:4px solid var(--ink)}
.toy select,.toy input[type=number]{font:inherit;padding:8px;border:1px solid var(--ink);background:var(--paper);width:100%;font-size:15px}
.toy label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);display:block;margin:12px 0 4px;text-transform:uppercase}
.toyrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toy button{margin-top:16px;width:100%;padding:12px;font:inherit;font-weight:700;background:var(--ink);color:#fff;border:none;cursor:pointer;font-size:15px}
.toy button:hover{background:var(--blue)}
.toyres{margin-top:16px;display:none}
.toyres .v{font-family:"Archivo Black";font-size:28px;line-height:32px}
.toyres .v span{color:var(--blue)}
.toyres .w{font-size:13px;color:var(--muted);margin-top:8px;line-height:20px}

.colophon{padding:24px 16px 48px;font-size:12px;line-height:16px;color:var(--muted)}
.colophon p{max-width:640px;margin-bottom:8px}
@media(min-width:760px){
  main{max-width:960px;margin:0 auto}
  .gside .pc{font-size:44px;line-height:48px}
  .halftime{grid-template-columns:repeat(4,1fr)}
  .hf{border-right:1px solid var(--faint)}
  .hf:last-child{border-right:none}
}

/* page nav */
.pagenav{position:sticky;top:36px;z-index:8;background:var(--paper);display:flex;overflow-x:auto;border-bottom:4px solid var(--ink);-webkit-overflow-scrolling:touch}
.pagenav a{flex:0 0 auto;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted);text-decoration:none;border-right:1px solid var(--faint)}
.pagenav a.on{color:var(--blue);box-shadow:inset 0 -4px 0 var(--blue)}
.bug .b1 a{color:#fff;text-decoration:none}
.ctrlgo{display:block;margin-top:12px;padding:12px;text-align:center;font-weight:700;background:var(--ink);color:#fff;text-decoration:none;font-size:15px}
.ctrlgo:hover{background:var(--blue)}
</style>
<link rel="stylesheet" href="ui.css" />
</head>
<body data-page="rundown">
<div class="bug"><span class="b1"><a href="index.html">THE MODEL</a></span><span class="b2" id="bug-week">WK 1</span><span class="b3" id="bug-upd"></span></div>
<nav class="pagenav">
<a href="index.html" data-pg="rundown" class="on">RUNDOWN</a>
<a href="record.html" data-pg="record">RECORD</a>
<a href="halftime.html" data-pg="halftime">HALFTIME</a>
<a href="crawl.html" data-pg="crawl">CRAWL</a>
<a href="injuries.html" data-pg="injuries">INJURIES</a>
<a href="play.html" data-pg="play">PLAY</a>

</nav>
<main>
<section class="board-hero" aria-labelledby="board-title"><div><p class="eyebrow">NFL FORECAST DESK</p><h1 id="board-title">THIS WEEK'S BOARD</h1><p id="lede" class="board-lede" aria-live="polite"></p></div><div class="board-meta" id="board-meta"></div></section>
<div class="board-tools" role="group" aria-label="Game filters"><button class="filter on" data-filter="all">ALL GAMES</button><button class="filter" data-filter="value">MARKET EDGE</button><button class="filter" data-filter="watch">TOSS-UPS</button><span id="wk-line"></span></div>
<div id="games"></div>
</main>
<script>const TZ="America/Chicago";
const DATA_BASE="./data/";
async function getJSON(f){try{const r=await fetch(DATA_BASE+f+"?t="+Date.now());return r.ok?await r.json():null}catch{return null}}
async function loadAll(){
  const [pred,lb,metrics,inj]=await Promise.all([
    getJSON("nfl_predictions.json").then(d=>d||getJSON("predictions.json")),
    getJSON("nfl_leaderboard.json").then(d=>d||getJSON("leaderboard.json")),
    getJSON("model_metrics.json"),
    getJSON("nfl_injuries.json")]);
  return {pred,lb,metrics,inj:inj?.injuries||[]};
}
const pct1=p=>p==null?"—":(p*100).toFixed(1)+"%";
const pct0=p=>p==null?"—":Math.round(p*100)+"%";
const fmtInt=n=>n==null?"—":Number(n).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function kickoff(g){const d=new Date(g.game_time);return{day:d.toLocaleDateString("en-US",{timeZone:TZ,weekday:"short"}).toUpperCase(),time:d.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}).replace(" ","").toLowerCase()}}
function gamesFor(pred,w){return (pred?.games||[]).filter(g=>g.week===w).sort((a,b)=>new Date(a.game_time)-new Date(b.game_time))}

const NFL_COORDS={ARI:[33.5276,-112.2626],ATL:[33.7553,-84.4006],BAL:[39.2780,-76.6227],BUF:[42.7738,-78.7870],CAR:[35.2258,-80.8528],CHI:[41.8623,-87.6167],CIN:[39.0954,-84.5160],CLE:[41.5061,-81.6995],DAL:[32.7473,-97.0945],DEN:[39.7439,-105.0201],DET:[42.3400,-83.0456],GB:[44.5013,-88.0622],HOU:[29.6847,-95.4107],IND:[39.7601,-86.1639],JAX:[30.3240,-81.6373],KC:[39.0489,-94.4839],LAC:[33.9534,-118.3392],LAR:[33.9534,-118.3392],LV:[36.0909,-115.1833],MIA:[25.9580,-80.2389],MIN:[44.9738,-93.2581],NE:[42.0909,-71.2643],NO:[29.9509,-90.0814],NYG:[40.8128,-74.0742],NYJ:[40.8128,-74.0742],PHI:[39.9008,-75.1675],PIT:[40.4468,-80.0158],SEA:[47.5952,-122.3316],SF:[37.4030,-121.9700],TB:[27.9759,-82.5033],TEN:[36.1665,-86.7713],WAS:[38.9076,-76.8645]};
const hav=(a,b)=>{const R=3958.8,r=Math.PI/180,dL=(b[0]-a[0])*r,dO=(b[1]-a[1])*r,h=Math.sin(dL/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dO/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const eP=d=>1/(1+Math.pow(10,-d/400));

let WEEK=null, PRED=null, LB=null, FILTER="all";

/* ── control room state ── */
const W0={logistic:.30,xgboost:.25,elo:.20,pyth:.15,eff:.10};
const CTRL={w:{...W0},hfa:65,touched:false};

function blend(p,force){
  if(!force&&!CTRL.touched&&p&&typeof p.ensemble_prob==="number"&&p.ensemble_prob>0)return p.ensemble_prob;
  if(!p)return .5;
  const w={...CTRL.w};
  if(p.xgb_prob==null){
    const xw=w.xgboost,rem=w.logistic+w.elo+w.pyth+w.eff;
    if(rem>0){w.logistic+=xw*w.logistic/rem;w.elo+=xw*w.elo/rem;w.pyth+=xw*w.pyth/rem;w.eff+=xw*w.eff/rem}
    w.xgboost=0;
  }
  const t=w.logistic+w.xgboost+w.elo+w.pyth+w.eff;
  if(t===0)return .5;
  return (w.logistic*(p.logistic_prob??.5)+w.xgboost*(p.xgb_prob??.5)+w.elo*(p.elo_prob??.5)+w.pyth*(p.pyth_prob??.5)+w.eff*(p.eff_prob??.5))/t;
}
function gameProb(g){
  const p={...(g.predictions||{})};
  if(CTRL.touched&&CTRL.hfa!==65&&g.elo){
    p.elo_prob=eP((g.elo.home??1500)+CTRL.hfa-(g.elo.away??1500));
    p.ensemble_prob=null;
  }
  return blend(p);
}


/* dial persistence - this visit only */
function ctrlSave(){try{sessionStorage.setItem("themodel_ctrl",JSON.stringify(CTRL))}catch{}}
function ctrlLoad(){try{const s=JSON.parse(sessionStorage.getItem("themodel_ctrl")||"null");if(s&&s.w){CTRL.w={...W0,...s.w};CTRL.hfa=s.hfa??65;CTRL.touched=!!s.touched}}catch{}}
function ctrlClear(){try{sessionStorage.removeItem("themodel_ctrl")}catch{}}
ctrlLoad();
/* ── rundown ── */
const AUD={}; /* game_id -> {he,ae} */
function renderGames(){
  const wrap=document.getElementById("games"); wrap.innerHTML="";
  let boardGames=gamesFor(PRED,WEEK).map(g=>({g,pr:gameProb(g)}));
  if(FILTER==="value")boardGames=boardGames.filter(({g})=>g.market?.home_prob!=null).sort((a,b)=>Math.abs((b.pr-(b.g.market?.home_prob??.5)))-Math.abs((a.pr-(a.g.market?.home_prob??.5))));
  if(FILTER==="watch")boardGames=boardGames.filter(({pr})=>Math.abs(pr-.5)<=.07);
  if(!boardGames.length){wrap.innerHTML='<p class="sec-note">No games match this filter.</p>';return}
  for(const {g,pr} of boardGames){
    const f={team:pr>=.5?g.home_team:g.away_team,p:Math.max(pr,1-pr)};
    const k=kickoff(g), mc=g.monte_carlo||{};
    const winSide=pr>=.5?"home":"away";
    const marketHome=g.market?.home_prob, marketAway=marketHome==null?null:1-marketHome;
    const favoriteModel=pr>=.5?pr:1-pr, favoriteMarket=pr>=.5?marketHome:marketAway;
    const edge=favoriteMarket==null?null:favoriteModel-favoriteMarket;
    const homeLogo=g.home_logo||`https://a.espncdn.com/i/teamlogos/nfl/500/${String(g.home_team||"").toLowerCase()}.png`;
    const awayLogo=g.away_logo||`https://a.espncdn.com/i/teamlogos/nfl/500/${String(g.away_team||"").toLowerCase()}.png`;
    const box=document.createElement("div"); box.className="game";
    box.innerHTML=`
      <button class="grow" type="button" aria-expanded="false">
        <span class="game-top"><span>${k.day} · ${k.time}</span><span class="market-state ${marketHome==null?"muted":""}">${marketHome==null?"MARKET PENDING":"MARKET LIVE"}</span></span>
        <span class="matchup">
          <span class="team ${winSide==="away"?"favored":""}"><img src="${esc(awayLogo)}" alt="" /><span class="team-copy"><span class="team-code">${esc(g.away_team)}</span><span class="team-name">${esc(g.away_name||g.away_team)}</span><span class="team-prob">${pct1(1-pr)}</span></span></span>
          <span class="vs">AT</span>
          <span class="team home ${winSide==="home"?"favored":""}"><img src="${esc(homeLogo)}" alt="" /><span class="team-copy"><span class="team-code">${esc(g.home_team)}</span><span class="team-name">${esc(g.home_name||g.home_team)}</span><span class="team-prob">${pct1(pr)}</span></span></span>
        </span>
        <span class="field" aria-label="${esc(g.home_team)} model probability ${pct1(pr)}"><i style="width:${pr*100}%"></i>${marketHome==null?"":`<b class="market-pin" style="left:${marketHome*100}%"></b>`}</span>
        <span class="game-bottom"><span><small>MODEL</small><b>${pct1(favoriteModel)}</b></span><span><small>MARKET</small><b>${favoriteMarket==null?"—":pct1(favoriteMarket)}</b></span><span class="${edge!=null&&edge>0?"good":""}"><small>EDGE</small><b>${edge==null?"—":(edge>=0?"+":"")+(edge*100).toFixed(1)+" PP"}</b></span></span>
      </button>
      <div class="gdet">
        <p><b>Elo</b> ${esc(g.home_team)} ${Math.round(g.elo?.home??0)} · ${esc(g.away_team)} ${Math.round(g.elo?.away??0)} · rest ${g.adjustments?.rest_home??"—"}/${g.adjustments?.rest_away??"—"} days${g.adjustments?.travel_dist_miles?" · "+esc(g.away_team)+" travels "+fmtInt(Math.round(g.adjustments.travel_dist_miles))+" mi":""}</p>
        <p><b>Simulation</b> ${esc(f.team)} by ${Math.abs(mc.exp_margin??0).toFixed(1)}, ${pct0(mc.prob_7plus)} to win by 7+, ${pct0(mc.prob_14plus)} by 14+</p>
        ${g.explanation?`<p>${esc(g.explanation).replace(/—/g,"-")}</p>`:""}
        <p class="models">${["ensemble_prob|MODEL|1","elo_prob|ELO","logistic_prob|LOG","xgb_prob|XGB","pyth_prob|PYTH","eff_prob|EFF","bayesian_prob|BAY"].map(s=>{const[kk,l,sh]=s.split("|");const v=g.predictions?.[kk];return v!=null?`<span class="${sh?"ship":""}">${l} ${pct0(v)}</span>`:""}).filter(Boolean).join(" · ")}</p>
        <div class="audible">
          <h5>CALL AN AUDIBLE</h5>
          <div class="audrow"><span>${esc(g.home_team)} edge</span><input type="range" min="-60" max="60" step="5" value="0" data-aud="he"><output>0</output></div>
          <div class="audrow"><span>${esc(g.away_team)} edge</span><input type="range" min="-60" max="60" step="5" value="0" data-aud="ae"><output>0</output></div>
          <p class="audres" style="display:none"></p>
        </div>
      </div>`;
    box.querySelector(".grow").addEventListener("click",()=>{const open=box.classList.toggle("open");box.querySelector(".grow").setAttribute("aria-expanded",String(open))});
    const res=box.querySelector(".audres");
    const doAud=()=>{
      const he=+box.querySelector('[data-aud=he]').value, ae=+box.querySelector('[data-aud=ae]').value;
      AUD[g.game_id]={he,ae};
      if(!he&&!ae){res.style.display="none";return}
      const p={...(g.predictions||{})};
      p.elo_prob=eP((g.elo?.home??1500)+CTRL.hfa+he-ae-(g.elo?.away??1500));
      p.ensemble_prob=null;
      const ap=blend(p,true);
      res.style.display="block";
      res.innerHTML=`Audible: <b>${esc(g.home_team)} ${pct1(ap)}</b> · ${esc(g.away_team)} ${pct1(1-ap)}`;
    };
    box.querySelectorAll("[data-aud]").forEach(sl=>sl.addEventListener("input",e=>{e.target.closest(".audrow").querySelector("output").textContent=e.target.value;doAud()}));
    wrap.appendChild(box);
  }
  document.getElementById("wk-line").textContent="WEEK "+WEEK+" OF 18";
}

/* ── on the record: the prediction log ── */
const LOGKEY="sport3_log_nfl";
function logRead(){try{return JSON.parse(localStorage.getItem(LOGKEY)||"[]")}catch{return[]}}
function logWrite(e){try{localStorage.setItem(LOGKEY,JSON.stringify(e))}catch{}}
function logGames(){
  const entries=logRead(), ids=new Set(entries.map(e=>e.game_id));
  let added=false;
  for(const g of (PRED?.games||[])){
    if(!g.game_id||ids.has(g.game_id))continue;
    const p=g.predictions?.ensemble_prob;
    if(typeof p!=="number")continue;
    entries.push({game_id:g.game_id,saved_at:new Date().toISOString(),home_team:g.home_team,away_team:g.away_team,game_time:g.game_time,week:g.week,predicted_winner:p>=.5?g.home_team:g.away_team,predicted_prob:Math.max(p,1-p),actual_winner:null,home_score:null,away_score:null});
    added=true;
  }
  if(added)logWrite(entries);
}
const ESPNFIX={"JAC":"JAX","ARZ":"ARI","CLV":"CLE","HST":"HOU","LVR":"LV","WSH":"WAS"};
const normAbbr=a=>{const u=(a||"").toUpperCase();return ESPNFIX[u]||u};
async function resolveWinners(){
  const entries=logRead(), un=entries.filter(e=>!e.actual_winner&&e.game_time&&new Date(e.game_time)<new Date());
  if(!un.length)return;
  const groups={};
  for(const e of un){const dt=new Date(e.game_time);const d=dt.getUTCFullYear()+String(dt.getUTCMonth()+1).padStart(2,"0")+String(dt.getUTCDate()).padStart(2,"0");(groups[d]=groups[d]||[]).push(e)}
  for(const [date,dayEntries] of Object.entries(groups)){
    try{
      const data=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates="+date).then(r=>r.json());
      for(const ev of (data.events||[])){
        const comp=(ev.competitions||[])[0]; if(!comp)continue;
        const cs=comp.competitors||[]; if(cs.length<2)continue;
        let winner=cs.find(c=>c.winner);
        const homeC=cs.find(c=>c.homeAway==="home"), awayC=cs.find(c=>c.homeAway==="away");
        if(!winner&&ev.status?.type?.name==="STATUS_FINAL"&&homeC&&awayC){
          const hs=parseInt(homeC.score,10),as=parseInt(awayC.score,10);
          if(!isNaN(hs)&&!isNaN(as)&&hs!==as)winner=hs>as?homeC:awayC;
        }
        if(!winner)continue;
        const wAbbr=normAbbr(winner.team?.abbreviation);
        const match=dayEntries.find(e=>e.game_id===ev.id||(e.home_team===normAbbr(homeC?.team?.abbreviation)&&e.away_team===normAbbr(awayC?.team?.abbreviation)));
        const entry=match&&entries.find(e=>e.game_id===match.game_id);
        if(entry&&wAbbr){
          entry.actual_winner=wAbbr;
          if(homeC?.score!=null)entry.home_score=parseInt(homeC.score,10);
          if(awayC?.score!=null)entry.away_score=parseInt(awayC.score,10);
        }
      }
    }catch{/* network failure, skip */}
  }
  logWrite(entries);
}
function renderLog(){
  const entries=logRead().slice().sort((a,b)=>new Date(b.game_time)-new Date(a.game_time));
  const resolved=entries.filter(e=>e.actual_winner);
  const hits=resolved.filter(e=>e.actual_winner===e.predicted_winner);
  document.getElementById("rec-strip").innerHTML=[
    {n:entries.length,l:"Called"},
    {n:hits.length,l:"Hit",blue:1},
    {n:resolved.length-hits.length,l:"Missed"},
    {n:resolved.length?(hits.length/resolved.length*100).toFixed(1)+"%":"—",l:"Graded",blue:1},
  ].map(s=>`<div class="rs"><span class="n ${s.blue?"blue":""}">${s.n}</span><span class="l">${s.l}</span></div>`).join("");
  document.getElementById("rec").innerHTML=entries.length?entries.map(e=>{
    const d=new Date(e.game_time);
    const ds=d.toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"}).toUpperCase();
    const graded=!!e.actual_winner, hit=graded&&e.actual_winner===e.predicted_winner;
    const score=graded&&e.home_score!=null?` · ${esc(e.away_team)} ${e.away_score}, ${esc(e.home_team)} ${e.home_score}`:"";
    return `<div class="rec"><span class="d">${ds}</span><span class="pk"><b>${esc(e.predicted_winner)}</b> ${(e.predicted_prob*100).toFixed(1)}%<span class="v"> · ${esc(e.away_team)} at ${esc(e.home_team)}${score}</span></span><span class="res ${graded?(hit?"hit":"miss"):"pend"}">${graded?(hit?"HIT":"MISS"):"PENDING"}</span></div>`;
  }).join(""):`<p class="sec-note">No picks on the record yet. This week's card was just dealt - check back after kickoff.</p>`;
}
document.getElementById("burn")?.addEventListener("click",()=>{
  if(!confirm("Burn the whole tape? Every logged pick on this device gets erased."))return;
  try{localStorage.removeItem(LOGKEY)}catch{};
  renderLog();
});


function fillBug(pred){
  if(!pred)return;
  document.getElementById("bug-week").textContent="WK "+(pred.week??1)+" · "+pred.season;
  const u=pred.updated?new Date(pred.updated):null;
  document.getElementById("bug-upd").textContent=u?("UPD "+u.toLocaleString("en-US",{timeZone:TZ,month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}).toUpperCase()):"";
}

(async()=>{
  const {pred,lb}=await loadAll();
  if(!pred){document.getElementById("lede").textContent="The data robot has not published tonight's file.";return}
  PRED=pred;LB=lb;WEEK=pred.week??1;
  fillBug(pred);
  const gs=gamesFor(pred,WEEK);
  let fv=null,tg=null;
  for(const g of gs){const p=g.predictions?.ensemble_prob;if(p==null)continue;const t=Math.max(p,1-p);if(!fv||t>fv.t)fv={g,t};if(!tg||t<tg.t)tg={g,t}}
  const marketCount=gs.filter(g=>g.market?.home_prob!=null).length;
  document.getElementById("lede").textContent="Pre-game model probabilities. Market comparison appears only when current odds are available. Open a game for assumptions and scenario testing.";
  document.getElementById("board-meta").innerHTML=`<div class="metric-chip signal"><strong>${fv?esc(fv.g.predictions.ensemble_prob>=.5?fv.g.home_team:fv.g.away_team)+" "+pct1(fv.t):"—"}</strong><span>TOP MODEL P</span></div><div class="metric-chip"><strong>${marketCount}/${gs.length}</strong><span>MARKETS LIVE</span></div><div class="metric-chip"><strong>${tg?pct1(tg.t):"—"}</strong><span>CLOSEST GAME</span></div>`;
  document.querySelectorAll(".filter").forEach(button=>button.addEventListener("click",()=>{FILTER=button.dataset.filter;document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("on",b===button));renderGames()}));
  renderGames();
  document.getElementById("wk-line").textContent="WEEK "+WEEK+" OF 18";
  logGames();
  resolveWinners();
})();
</script>
